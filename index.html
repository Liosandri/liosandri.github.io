<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calcetto du Jeudi</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #1a7a3a;
    --green-light: #22a04e;
    --green-dark: #0f5228;
    --gold: #f5c518;
    --gold-dark: #c9a010;
    --red: #e63946;
    --blue: #1d6fa4;
    --white: #f0f0e8;
    --dark: #0d1117;
    --card-bg: #161b22;
    --border: rgba(255,255,255,0.08);
    --text-muted: #8b949e;
    --pitch-green: #2d6a2d;
    --pitch-line: rgba(255,255,255,0.25);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--dark);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SPLASH ── */
  #splash {
    position: fixed; inset:0; z-index:1000;
    background: var(--dark);
    display: flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  #splash .ball { font-size: 64px; animation: bounce 0.8s infinite alternate ease-in-out; }
  @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
  #splash h1 { font-family:'Bebas Neue'; font-size:36px; letter-spacing:3px; color:var(--gold); }
  #splash p { color:var(--text-muted); font-size:14px; }

  /* ── LOGIN ── */
  #loginScreen {
    display: none; min-height:100vh;
    flex-direction:column; align-items:center; justify-content:center; padding:24px;
    background: radial-gradient(ellipse at 50% 0%, rgba(34,160,78,0.15) 0%, transparent 60%);
  }
  #loginScreen .logo { text-align:center; margin-bottom:40px; }
  #loginScreen .logo .icon { font-size:56px; margin-bottom:8px; }
  #loginScreen .logo h1 { font-family:'Bebas Neue'; font-size:42px; letter-spacing:4px; color:var(--gold); }
  #loginScreen .logo p { color:var(--text-muted); font-size:14px; letter-spacing:2px; text-transform:uppercase; }

  .login-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    width: 100%; max-width: 360px;
  }
  .login-card h2 { font-family:'Barlow Condensed'; font-size:20px; font-weight:600; margin-bottom:24px; color:var(--text-muted); letter-spacing:1px; text-transform:uppercase; }

  .field { margin-bottom:16px; }
  .field label { display:block; font-size:12px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .field input {
    width:100%; padding:12px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius:8px; color:var(--white);
    font-family:'Barlow'; font-size:16px;
    outline:none; transition: border-color 0.2s;
  }
  .field input:focus { border-color: var(--green-light); }

  .btn {
    width:100%; padding:14px;
    border:none; border-radius:8px; cursor:pointer;
    font-family:'Barlow Condensed'; font-size:18px; font-weight:700; letter-spacing:1px;
    transition: all 0.2s; text-transform:uppercase;
  }
  .btn-primary { background: var(--green); color:var(--white); }
  .btn-primary:hover { background: var(--green-light); }
  .btn-primary:active { transform:scale(0.98); }
  .btn-gold { background: var(--gold); color: var(--dark); }
  .btn-gold:hover { background: var(--gold-dark); }
  .btn-danger { background: var(--red); color:#fff; }
  .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text-muted); }
  .btn-outline:hover { border-color:var(--green-light); color:var(--white); }
  .btn-sm { padding:8px 16px; font-size:14px; border-radius:6px; }
  .btn-icon { width:auto; padding:8px 12px; }

  .error-msg { color:var(--red); font-size:13px; margin-top:8px; display:none; }
  .error-msg.show { display:block; }

  /* ── APP LAYOUT ── */
  #app { display:none; flex-direction:column; min-height:100vh; }

  /* ── HEADER ── */
  .app-header {
    background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex; align-items:center; justify-content:space-between;
    position: sticky; top:0; z-index:100;
  }
  .app-header .logo { font-family:'Bebas Neue'; font-size:22px; letter-spacing:2px; color:var(--gold); }
  .app-header .user-info { display:flex; align-items:center; gap:10px; }
  .app-header .user-name { font-size:14px; font-weight:600; }
  .app-header .user-badge {
    width:32px; height:32px; border-radius:50%;
    background: var(--green); display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
  }

  /* ── TABS ── */
  .tabs {
    display: flex; background: var(--card-bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto; scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar { display:none; }
  .tab {
    flex: 1; min-width: 70px;
    padding: 12px 8px;
    text-align:center; cursor:pointer;
    font-family:'Barlow Condensed'; font-size:12px; font-weight:600;
    letter-spacing:0.5px; text-transform:uppercase;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
    white-space:nowrap;
  }
  .tab.active { color:var(--gold); border-bottom-color:var(--gold); }
  .tab .tab-icon { display:block; font-size:18px; margin-bottom:2px; }
  .tab .badge {
    display:inline-block; background:var(--red); color:#fff;
    font-size:9px; padding:1px 4px; border-radius:8px; margin-left:2px; vertical-align:top;
  }

  /* ── CONTENT ── */
  .content { flex:1; overflow-y:auto; padding:0; }
  .tab-panel { display:none; padding:16px; }
  .tab-panel.active { display:block; }

  /* ── MATCH STATUS CARD ── */
  .match-card {
    background: linear-gradient(135deg, var(--green-dark), var(--green));
    border-radius: 16px; padding: 20px;
    margin-bottom: 16px; position:relative; overflow:hidden;
  }
  .match-card::before {
    content:''; position:absolute;
    top:-30px; right:-30px;
    width:120px; height:120px;
    background: rgba(255,255,255,0.05);
    border-radius:50%;
  }
  .match-card::after {
    content:'⚽'; position:absolute;
    bottom:-10px; right:10px;
    font-size:60px; opacity:0.15;
  }
  .match-date { font-size:12px; opacity:0.7; text-transform:uppercase; letter-spacing:2px; }
  .match-title { font-family:'Bebas Neue'; font-size:28px; letter-spacing:2px; margin:4px 0; }
  .match-status { font-size:14px; opacity:0.85; }

  .match-cancelled {
    background: linear-gradient(135deg, #3a1010, #6b1f1f) !important;
  }

  /* ── PLAYER COUNT ── */
  .player-count {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
    margin-bottom: 16px;
  }
  .count-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .count-label { font-family:'Barlow Condensed'; font-size:14px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }
  .count-num { font-family:'Bebas Neue'; font-size:28px; color:var(--gold); }
  .progress-bar { height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
  .progress-fill { height:100%; background:var(--green-light); border-radius:3px; transition:width 0.5s ease; }
  .progress-fill.full { background:var(--gold); }

  /* ── MY REGISTRATION ── */
  .my-reg {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px; padding: 16px;
    margin-bottom: 16px;
  }
  .my-reg-title { font-family:'Barlow Condensed'; font-size:13px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
  .reg-buttons { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .btn-present { background:var(--green); color:#fff; }
  .btn-present.active { background:var(--green-light); box-shadow:0 0 0 2px var(--green-light), 0 0 12px rgba(34,160,78,0.4); }
  .btn-absent { background: rgba(255,255,255,0.05); color:var(--text-muted); border:1px solid var(--border); }
  .btn-absent.active { background:rgba(230,57,70,0.15); color:var(--red); border-color:var(--red); }

  /* ── PLAYERS LIST ── */
  .section-title {
    font-family:'Barlow Condensed'; font-size:13px; font-weight:600;
    color:var(--text-muted); text-transform:uppercase; letter-spacing:1px;
    margin-bottom:10px; display:flex; align-items:center; gap:8px;
  }
  .section-title::after { content:''; flex:1; height:1px; background:var(--border); }

  .players-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .player-chip {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    border-radius:8px; padding:10px 12px;
    display:flex; align-items:center; gap:8px;
    cursor:pointer; transition:all 0.2s;
  }
  .player-chip:hover { border-color:var(--green-light); background:rgba(34,160,78,0.08); }
  .player-chip .chip-avatar {
    width:28px; height:28px; border-radius:50%;
    background:var(--green-dark);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700; flex-shrink:0;
  }
  .player-chip .chip-name { font-size:13px; font-weight:600; }
  .player-chip .chip-pts { font-size:11px; color:var(--text-muted); }
  .player-chip.inscrit .chip-avatar { background:var(--green); }
  .player-chip.inscrit { border-color:rgba(34,160,78,0.3); }

  /* ── PHASE BADGE ── */
  .phase-badge {
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 12px; border-radius:20px;
    font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:1px;
    margin-bottom:12px;
  }
  .phase-badge.open_classic { background:rgba(34,160,78,0.15); color:var(--green-light); border:1px solid rgba(34,160,78,0.3); }
  .phase-badge.open_rotation { background:rgba(245,197,24,0.15); color:var(--gold); border:1px solid rgba(245,197,24,0.3); }
  .phase-badge.closed { background:rgba(230,57,70,0.15); color:var(--red); border:1px solid rgba(230,57,70,0.3); }

  /* ── STATS (FIFA CARD) ── */
  .stats-section { padding-bottom:40px; }

  .player-search {
    margin-bottom:12px; position:relative;
  }
  .player-search input {
    width:100%; padding:10px 16px 10px 36px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius:8px; color:var(--white);
    font-family:'Barlow'; font-size:15px; outline:none;
  }
  .player-search .search-icon { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); }

  /* ── FIFA CARD ── */
  .fifa-cards-grid { display:flex; flex-direction:column; gap:12px; }

  .fifa-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition: all 0.2s;
  }
  .fifa-card:hover { border-color:var(--green-light); }

  .fifa-card-header {
    display:flex; align-items:center; gap:12px;
    padding:12px 14px 10px;
    background: linear-gradient(90deg, rgba(34,160,78,0.1), transparent);
    border-bottom:1px solid var(--border);
  }

  .fifa-overall {
    width:48px; height:48px; border-radius:10px; flex-shrink:0;
    background: var(--green);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    position:relative; overflow:hidden;
  }
  .fifa-overall::before {
    content:''; position:absolute; inset:0;
    background:linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
  }
  .fifa-overall .ov-num { font-family:'Bebas Neue'; font-size:22px; line-height:1; }
  .fifa-overall .ov-label { font-size:8px; opacity:0.7; text-transform:uppercase; letter-spacing:1px; }

  /* Overall color coding */
  .fifa-overall.ov-elite { background:linear-gradient(135deg, #c9a010, #f5c518); color:var(--dark); }
  .fifa-overall.ov-good { background:linear-gradient(135deg, #1a7a3a, #22a04e); }
  .fifa-overall.ov-avg { background:linear-gradient(135deg, #1d6fa4, #2589c4); }
  .fifa-overall.ov-low { background:linear-gradient(135deg, #555, #777); }

  .fifa-player-info { flex:1; min-width:0; }
  .fifa-player-name { font-family:'Barlow Condensed'; font-size:18px; font-weight:700; letter-spacing:0.5px; }
  .fifa-player-sub { font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; }

  .fifa-card-stats {
    padding:10px 14px;
    display:grid; grid-template-columns:repeat(5,1fr); gap:6px;
  }
  .stat-item { text-align:center; }
  .stat-value { font-family:'Bebas Neue'; font-size:18px; line-height:1; }
  .stat-label { font-size:9px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.5px; }
  .stat-bar { height:3px; background:rgba(255,255,255,0.1); border-radius:2px; margin-top:3px; overflow:hidden; }
  .stat-bar-fill { height:100%; border-radius:2px; }

  /* Stat color coding */
  .stat-elite .stat-value { color:#f5c518; }
  .stat-elite .stat-bar-fill { background:#f5c518; }
  .stat-good .stat-value { color:#22a04e; }
  .stat-good .stat-bar-fill { background:#22a04e; }
  .stat-avg .stat-value { color:#2589c4; }
  .stat-avg .stat-bar-fill { background:#2589c4; }
  .stat-low .stat-value { color:#888; }
  .stat-low .stat-bar-fill { background:#888; }

  /* ── HISTORY ── */
  .history-dots { display:flex; gap:4px; flex-wrap:wrap; }
  .dot {
    width:20px; height:20px; border-radius:4px;
    display:flex; align-items:center; justify-content:center;
    font-size:10px; font-weight:700;
  }
  .dot-V { background:rgba(34,160,78,0.2); color:var(--green-light); border:1px solid rgba(34,160,78,0.4); }
  .dot-D { background:rgba(230,57,70,0.2); color:var(--red); border:1px solid rgba(230,57,70,0.4); }
  .dot-empty { background:rgba(255,255,255,0.04); border:1px solid var(--border); }

  /* ── PITCH / TEAMS ── */
  .pitch-container {
    border-radius:12px; overflow:hidden;
    margin-bottom:16px;
  }

  .pitch {
    position:relative; width:100%;
    background: var(--pitch-green);
    padding: 16px 10px;
    min-height:420px;
  }

  /* Pitch lines */
  .pitch::before {
    content:'';
    position:absolute; inset:10px;
    border:2px solid var(--pitch-line);
    border-radius:4px;
  }
  .pitch-center-line {
    position:absolute; left:10px; right:10px;
    top:50%; height:2px;
    background:var(--pitch-line);
  }
  .pitch-center-circle {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:70px; height:70px;
    border:2px solid var(--pitch-line);
    border-radius:50%;
  }
  .pitch-center-dot {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:6px; height:6px;
    background:var(--pitch-line); border-radius:50%;
  }
  /* Goal areas */
  .pitch-goal-top, .pitch-goal-bot {
    position:absolute; left:50%; transform:translateX(-50%);
    width:60%; height:50px;
    border:2px solid var(--pitch-line);
  }
  .pitch-goal-top { top:10px; border-top:none; }
  .pitch-goal-bot { bottom:10px; border-bottom:none; }

  .pitch-team {
    position:relative; z-index:2;
    display:flex; flex-wrap:wrap; justify-content:center; gap:6px;
    width:100%;
  }
  .pitch-team-1 { margin-bottom:auto; padding-bottom:8px; }
  .pitch-team-2 { margin-top:auto; padding-top:8px; }

  .pitch-players-area {
    position:relative; z-index:2;
    height:100%;
    display:flex; flex-direction:column;
    justify-content:space-around;
    padding:40px 0;
  }

  .pitch-player-token {
    display:flex; flex-direction:column; align-items:center;
    gap:3px;
  }
  .pitch-player-token .token-circle {
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:13px;
    border:2px solid rgba(255,255,255,0.5);
    font-weight:700;
  }
  .team1-color .token-circle { background:rgba(30,90,200,0.85); }
  .team2-color .token-circle { background:rgba(200,30,30,0.85); }
  .pitch-player-token .token-name {
    font-size:9px; font-weight:700; text-transform:uppercase;
    color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.8);
    max-width:50px; text-align:center; line-height:1.1;
  }

  .teams-layout {
    position:relative; min-height:400px;
  }
  .pitch-half {
    position:absolute; width:100%;
  }
  .pitch-half-1 { top:20px; }
  .pitch-half-2 { bottom:20px; }

  .team-row {
    display:flex; justify-content:space-around; align-items:center;
    margin-bottom:12px;
  }

  /* Team vote */
  .team-vote-section {
    background:var(--card-bg);
    border:1px solid var(--border);
    border-radius:12px; padding:16px;
    margin-top:12px;
  }
  .vote-title { font-family:'Barlow Condensed'; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:1px; margin-bottom:12px; }
  .vote-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .vote-btn {
    padding:12px; border:2px solid var(--border);
    border-radius:10px; background:transparent;
    color:var(--white); cursor:pointer;
    font-family:'Barlow Condensed'; font-size:14px; font-weight:700;
    text-transform:uppercase; letter-spacing:1px; transition:all 0.2s;
    text-align:center;
  }
  .vote-btn.team1-vote { border-color:rgba(30,90,200,0.5); }
  .vote-btn.team2-vote { border-color:rgba(200,30,30,0.5); }
  .vote-btn.voted { opacity:0.6; cursor:not-allowed; }
  .vote-btn.team1-vote:hover { background:rgba(30,90,200,0.2); border-color:#1e5ac8; }
  .vote-btn.team2-vote:hover { background:rgba(200,30,30,0.2); border-color:#c81e1e; }

  .vote-results { margin-top:12px; }
  .vote-bar-wrap { margin-bottom:8px; }
  .vote-bar-label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; color:var(--text-muted); }
  .vote-bar { height:8px; background:rgba(255,255,255,0.06); border-radius:4px; overflow:hidden; }
  .vote-bar-fill { height:100%; border-radius:4px; transition:width 0.6s ease; }
  .vote-bar-fill.t1 { background:#1e5ac8; }
  .vote-bar-fill.t2 { background:#c81e1e; }

  /* Team header on pitch */
  .pitch-team-header {
    position:absolute; z-index:3;
    font-family:'Bebas Neue'; font-size:13px; letter-spacing:2px;
    padding:3px 10px; border-radius:4px;
  }
  .pitch-team-header.t1 { top:12px; left:50%; transform:translateX(-50%); background:rgba(30,90,200,0.7); }
  .pitch-team-header.t2 { bottom:12px; left:50%; transform:translateX(-50%); background:rgba(200,30,30,0.7); }

  /* ── MVP VOTE ── */
  .mvp-section { }
  .mvp-info {
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:16px;
  }
  .mvp-info-title { font-family:'Barlow Condensed'; font-size:14px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:6px; }
  .mvp-info-body { font-size:14px; color:var(--text-muted); }

  .mvp-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mvp-candidate {
    background: rgba(255,255,255,0.04);
    border:2px solid var(--border);
    border-radius:10px; padding:14px 10px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    cursor:pointer; transition:all 0.2s;
    text-align:center;
  }
  .mvp-candidate:hover { border-color:var(--gold); background:rgba(245,197,24,0.06); }
  .mvp-candidate.voted { border-color:var(--gold); background:rgba(245,197,24,0.12); cursor:not-allowed; }
  .mvp-candidate .cand-avatar {
    width:44px; height:44px; border-radius:50%;
    background:var(--green-dark); display:flex; align-items:center; justify-content:center;
    font-family:'Bebas Neue'; font-size:18px;
  }
  .mvp-candidate .cand-name { font-size:14px; font-weight:700; }
  .mvp-candidate .cand-votes { font-size:20px; font-family:'Bebas Neue'; color:var(--gold); }
  .mvp-candidate .cand-votes-label { font-size:10px; color:var(--text-muted); }

  .mvp-winner {
    background:linear-gradient(135deg, rgba(245,197,24,0.15), rgba(245,197,24,0.05));
    border:2px solid var(--gold);
    border-radius:16px; padding:24px; text-align:center;
    margin-bottom:16px;
  }
  .mvp-winner .winner-icon { font-size:48px; margin-bottom:8px; }
  .mvp-winner .winner-name { font-family:'Bebas Neue'; font-size:36px; color:var(--gold); }
  .mvp-winner .winner-votes { color:var(--text-muted); font-size:14px; }

  /* ── ADMIN PANEL ── */
  .admin-section {
    background:rgba(230,57,70,0.05);
    border:1px solid rgba(230,57,70,0.2);
    border-radius:12px; padding:16px; margin-bottom:16px;
  }
  .admin-title { font-family:'Barlow Condensed'; font-size:16px; font-weight:700; color:var(--red); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; display:flex; align-items:center; gap:8px; }

  .results-grid { display:grid; gap:8px; }
  .result-row {
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,0.03); border-radius:8px; padding:10px 12px;
  }
  .result-name { flex:1; font-size:14px; font-weight:600; }
  .result-btns { display:flex; gap:6px; }
  .result-btn {
    padding:6px 14px; border:none; border-radius:6px;
    font-family:'Barlow Condensed'; font-size:14px; font-weight:700;
    cursor:pointer; transition:all 0.15s; letter-spacing:0.5px;
  }
  .result-btn.V { background:rgba(34,160,78,0.2); color:var(--green-light); border:1px solid rgba(34,160,78,0.3); }
  .result-btn.V.active { background:var(--green); color:#fff; }
  .result-btn.D { background:rgba(230,57,70,0.2); color:var(--red); border:1px solid rgba(230,57,70,0.3); }
  .result-btn.D.active { background:var(--red); color:#fff; }
  .result-btn.A { background:rgba(255,255,255,0.05); color:var(--text-muted); border:1px solid var(--border); }
  .result-btn.A.active { background:rgba(255,255,255,0.15); color:var(--white); }

  /* ── SETTINGS ── */
  .settings-card {
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:12px;
  }
  .settings-title { font-family:'Barlow Condensed'; font-size:14px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; }

  /* ── TOAST ── */
  #toast {
    position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px);
    background:#1e1e2e; border:1px solid rgba(255,255,255,0.1);
    color:#fff; padding:10px 20px; border-radius:20px;
    font-size:14px; z-index:9999; opacity:0;
    transition:all 0.3s; pointer-events:none;
    white-space:nowrap; max-width:90vw; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.success { border-color:rgba(34,160,78,0.5); background:rgba(15,40,20,0.95); }
  #toast.error { border-color:rgba(230,57,70,0.5); background:rgba(40,10,10,0.95); }

  /* ── LOADER ── */
  .loader {
    display:flex; align-items:center; justify-content:center;
    padding:40px; gap:8px; color:var(--text-muted); font-size:14px;
  }
  .spinner {
    width:18px; height:18px;
    border:2px solid rgba(255,255,255,0.1);
    border-top-color: var(--green-light);
    border-radius:50%;
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* ── EMPTY STATE ── */
  .empty-state { text-align:center; padding:40px 20px; color:var(--text-muted); }
  .empty-state .empty-icon { font-size:40px; margin-bottom:12px; }
  .empty-state p { font-size:14px; }

  /* ── PIN CHANGE MODAL ── */
  .modal-overlay {
    position:fixed; inset:0; z-index:500;
    background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-overlay.open { display:flex; }
  .modal {
    background:var(--card-bg); border:1px solid var(--border);
    border-radius:20px 20px 0 0;
    padding:24px; width:100%; max-width:420px;
  }
  .modal h3 { font-family:'Barlow Condensed'; font-size:20px; font-weight:700; margin-bottom:20px; }
  .modal-actions { display:flex; gap:10px; margin-top:16px; }
  .modal-actions .btn { flex:1; }

  /* ── RESPONSIVE ── */
  @media (max-width: 380px) {
    .fifa-card-stats { gap:4px; }
    .stat-value { font-size:16px; }
  }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity:0; transform:translateY(16px); }
    to { opacity:1; transform:translateY(0); }
  }
  .tab-panel.active { animation: fadeInUp 0.25s ease; }

  .no-match-warn {
    background:rgba(230,57,70,0.1);
    border:1px solid rgba(230,57,70,0.3);
    border-radius:10px; padding:12px 16px;
    font-size:14px; color:var(--red); margin-bottom:12px;
    display:flex; align-items:center; gap:8px;
  }

  .inscrit-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .inscrit-tag {
    padding:4px 10px; background:rgba(34,160,78,0.15);
    border:1px solid rgba(34,160,78,0.3); border-radius:20px;
    font-size:12px; font-weight:600; color:var(--green-light);
  }

  .regenerate-btn {
    margin-top:10px; width:100%;
    background:rgba(255,255,255,0.05); border:1px solid var(--border);
    border-radius:8px; padding:10px;
    color:var(--text-muted); font-family:'Barlow Condensed'; font-size:14px; font-weight:600;
    cursor:pointer; text-transform:uppercase; letter-spacing:1px; transition:all 0.2s;
  }
  .regenerate-btn:hover { border-color:var(--green-light); color:var(--white); }
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="ball">⚽</div>
  <h1>Calcetto</h1>
  <p>Chargement en cours...</p>
</div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="logo">
    <div class="icon">⚽</div>
    <h1>CALCETTO</h1>
    <p>du jeudi</p>
  </div>
  <div class="login-card">
    <h2>Connexion</h2>
    <div class="field">
      <label>Numéro de téléphone</label>
      <input type="tel" id="loginTel" placeholder="06 XX XX XX XX">
    </div>
    <div class="field">
      <label>Code PIN</label>
      <input type="password" id="loginPin" placeholder="••••" inputmode="numeric" maxlength="6">
    </div>
    <p class="error-msg" id="loginError"></p>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Se connecter</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <header class="app-header">
    <span class="logo">⚽ CALCETTO</span>
    <div class="user-info">
      <div id="headerUserName" class="user-name"></div>
      <div id="headerAvatar" class="user-badge"></div>
    </div>
  </header>

  <nav class="tabs" id="mainTabs">
    <div class="tab active" data-tab="home" onclick="switchTab('home')">
      <span class="tab-icon">🏠</span>Home
    </div>
    <div class="tab" data-tab="stats" onclick="switchTab('stats')">
      <span class="tab-icon">📊</span>Stats
    </div>
    <div class="tab" data-tab="teams" onclick="switchTab('teams')" id="tabTeams" style="display:none">
      <span class="tab-icon">⚡</span>Teams
    </div>
    <div class="tab" data-tab="mvp" onclick="switchTab('mvp')" id="tabMVP" style="display:none">
      <span class="tab-icon">🏆</span>MVP
    </div>
    <div class="tab" data-tab="settings" onclick="switchTab('settings')">
      <span class="tab-icon">⚙️</span>Profil
    </div>
  </nav>

  <div class="content">
    <!-- HOME -->
    <div class="tab-panel active" id="panel-home">
      <div id="homeContent"><div class="loader"><div class="spinner"></div>Chargement...</div></div>
    </div>

    <!-- STATS -->
    <div class="tab-panel stats-section" id="panel-stats">
      <div class="player-search">
        <span class="search-icon">🔍</span>
        <input type="text" id="statsSearch" placeholder="Rechercher un joueur..." oninput="filterStats()">
      </div>
      <div class="fifa-cards-grid" id="statsGrid">
        <div class="loader"><div class="spinner"></div>Chargement...</div>
      </div>
    </div>

    <!-- TEAMS -->
    <div class="tab-panel" id="panel-teams">
      <div id="teamsContent"><div class="empty-state"><div class="empty-icon">⚡</div><p>Équipes disponibles quand le groupe est complet</p></div></div>
    </div>

    <!-- MVP -->
    <div class="tab-panel" id="panel-mvp">
      <div id="mvpContent"><div class="empty-state"><div class="empty-icon">🏆</div><p>Vote MVP disponible après le match</p></div></div>
    </div>

    <!-- SETTINGS -->
    <div class="tab-panel" id="panel-settings">
      <div class="settings-card">
        <div class="settings-title">Mon profil</div>
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;">
          <div id="profileAvatar" style="width:56px;height:56px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-family:'Bebas Neue';font-size:24px;"></div>
          <div>
            <div id="profileName" style="font-size:18px;font-weight:700;"></div>
            <div id="profileTel" style="font-size:13px;color:var(--text-muted);"></div>
          </div>
        </div>
        <button class="btn btn-outline" onclick="openPinModal()">🔑 Changer mon PIN</button>
      </div>
      <button class="btn btn-outline btn-sm" onclick="doLogout()" style="width:100%;margin-top:8px;">Déconnexion</button>
    </div>
  </div>
</div>

<!-- PIN MODAL -->
<div class="modal-overlay" id="pinModal">
  <div class="modal">
    <h3>🔑 Changer mon PIN</h3>
    <div class="field">
      <label>Ancien PIN</label>
      <input type="password" id="oldPin" inputmode="numeric" maxlength="6" placeholder="••••">
    </div>
    <div class="field">
      <label>Nouveau PIN</label>
      <input type="password" id="newPin" inputmode="numeric" maxlength="6" placeholder="••••">
    </div>
    <div class="field">
      <label>Confirmer nouveau PIN</label>
      <input type="password" id="newPin2" inputmode="numeric" maxlength="6" placeholder="••••">
    </div>
    <p class="error-msg" id="pinError"></p>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closePinModal()">Annuler</button>
      <button class="btn btn-primary" onclick="doChangePin()">Confirmer</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ──────────────────────────────────────────────────────────────
// CONFIG - replace with your deployed Apps Script URL
// ──────────────────────────────────────────────────────────────
const API_URL = typeof google !== 'undefined'
  ? null // used via google.script.run when served from Apps Script
  : 'https://script.google.com/macros/s/AKfycbwj_aYlrhynvl-fhHkQFRBwG70sX8iLFLnY0eBVIga0KzYkjdH3DLITMHwmqeFJ3ipC/exec';

// ──────────────────────────────────────────────────────────────
// STATE
// ──────────────────────────────────────────────────────────────
let state = {
  user: null,
  data: null,
  currentTab: 'home',
  adminResults: {}
};

// ──────────────────────────────────────────────────────────────
// API
// ──────────────────────────────────────────────────────────────
async function api(params) {
  const url = new URL(API_URL || window.location.href);
  Object.entries(params).forEach(([k,v]) => url.searchParams.set(k, typeof v === 'object' ? JSON.stringify(v) : v));
  const resp = await fetch(url.toString());
  return resp.json();
}

// ──────────────────────────────────────────────────────────────
// INIT
// ──────────────────────────────────────────────────────────────
window.addEventListener('load', async () => {
  // Check saved session
  const saved = localStorage.getItem('calcetto_user');
  if (saved) {
    try {
      state.user = JSON.parse(saved);
      await loadApp();
      return;
    } catch(e) { localStorage.removeItem('calcetto_user'); }
  }
  hideSplash();
  showLogin();
});

function hideSplash() {
  setTimeout(() => {
    document.getElementById('splash').style.opacity = '0';
    document.getElementById('splash').style.transition = 'opacity 0.3s';
    setTimeout(() => document.getElementById('splash').style.display = 'none', 300);
  }, 800);
}

function showLogin() {
  hideSplash();
  const el = document.getElementById('loginScreen');
  el.style.display = 'flex';
}

async function loadApp() {
  hideSplash();
  document.getElementById('loginScreen').style.display = 'none';

  // Show app
  const app = document.getElementById('app');
  app.style.display = 'flex';
  app.style.flexDirection = 'column';

  // Set user info
  document.getElementById('headerUserName').textContent = state.user.name;
  document.getElementById('headerAvatar').textContent = state.user.name[0].toUpperCase();
  document.getElementById('profileName').textContent = state.user.name;
  document.getElementById('profileTel').textContent = state.user.tel || '';
  document.getElementById('profileAvatar').textContent = state.user.name[0].toUpperCase();

  // Load data
  await refreshData();
}

async function refreshData() {
  try {
    const data = await api({ action: 'getData' });
    state.data = data;
    renderHome();
    renderStats();
    renderTeams();
    renderMVP();
    updateTabVisibility();
  } catch(e) {
    showToast('Erreur de chargement', 'error');
  }
}

function updateTabVisibility() {
  const d = state.data;
  if (!d) return;
  // Show Teams tab if teamVoting exists
  const teamsTab = document.getElementById('tabTeams');
  teamsTab.style.display = (d.teamVoting && d.teamVoting.team1) ? '' : 'none';
  // Show MVP tab if mvpVoting exists
  const mvpTab = document.getElementById('tabMVP');
  mvpTab.style.display = (d.mvpVoting && d.mvpVoting.candidates) ? '' : 'none';
  // Badge if user hasn't voted MVP
  if (d.mvpVoting && d.mvpVoting.candidates && !d.mvpVoting.voters.includes(state.user.name)) {
    mvpTab.querySelector('.tab-icon').textContent = '🏆';
    // small badge
    let badge = mvpTab.querySelector('.badge');
    if (!badge) { badge = document.createElement('span'); badge.className='badge'; badge.textContent='!'; mvpTab.appendChild(badge); }
  }
}

// ──────────────────────────────────────────────────────────────
// LOGIN
// ──────────────────────────────────────────────────────────────
async function doLogin() {
  const tel = document.getElementById('loginTel').value.trim();
  const pin = document.getElementById('loginPin').value.trim();
  const errEl = document.getElementById('loginError');
  errEl.classList.remove('show');

  if (!tel || !pin) { errEl.textContent='Remplis tous les champs'; errEl.classList.add('show'); return; }

  const btn = document.getElementById('loginBtn');
  btn.textContent = 'Connexion...'; btn.disabled = true;

  try {
    const res = await api({ action:'checkLogin', tel, pin });
    if (res.success) {
      state.user = { name: res.name, tel, isAdmin: res.isAdmin };
      localStorage.setItem('calcetto_user', JSON.stringify(state.user));
      await loadApp();
    } else {
      errEl.textContent = res.error || 'Erreur de connexion';
      errEl.classList.add('show');
    }
  } catch(e) {
    errEl.textContent = 'Erreur réseau';
    errEl.classList.add('show');
  } finally {
    btn.textContent = 'Se connecter'; btn.disabled = false;
  }
}

document.getElementById('loginPin').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogout() {
  localStorage.removeItem('calcetto_user');
  state.user = null; state.data = null;
  document.getElementById('app').style.display = 'none';
  showLogin();
  showToast('Déconnecté');
}

// ──────────────────────────────────────────────────────────────
// TABS
// ──────────────────────────────────────────────────────────────
function switchTab(tab) {
  // Update tabs
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-'+tab));
  state.currentTab = tab;
}

// ──────────────────────────────────────────────────────────────
// HOME
// ──────────────────────────────────────────────────────────────
function renderHome() {
  const d = state.data;
  if (!d || !d.success) { document.getElementById('homeContent').innerHTML = '<div class="empty-state"><p>Erreur de chargement</p></div>'; return; }

  const inscrits = d.inscrits || [];
  const nbInscrits = inscrits.length;
  const isInscrit = inscrits.includes(state.user.name);
  const pct = Math.min(100, (nbInscrits/10)*100);
  const isFull = nbInscrits >= 10;

  // Phase
  const phase = getPhaseClient();
  const phaseLabels = {
    open_classic: '🟢 Inscriptions ouvertes',
    open_rotation: '🟡 Fenêtre rotation',
    closed: '🔴 Inscriptions fermées'
  };

  // Next thursday
  const nextThu = getNextThursday();
  const options = { weekday:'long', day:'numeric', month:'long' };
  const dateStr = nextThu.toLocaleDateString('fr-FR', options);

  let html = '';

  // Cancelled
  if (d.matchAnnule) {
    html += `<div class="match-card match-cancelled">
      <div class="match-date">MATCH ANNULÉ</div>
      <div class="match-title">❌ Pas de match</div>
      <div class="match-status">Le match de jeudi est annulé. À la semaine prochaine !</div>
    </div>`;
  } else {
    html += `<div class="match-card">
      <div class="match-date">${dateStr.toUpperCase()}</div>
      <div class="match-title">MATCH DU JEUDI</div>
      <div class="match-status">${isFull ? '✅ Groupe complet !' : nbInscrits + ' joueur' + (nbInscrits>1?'s':'') + ' inscrit' + (nbInscrits>1?'s':'')}</div>
    </div>`;
  }

  // Phase badge
  html += `<div class="phase-badge ${phase}">${phaseLabels[phase]||phase}</div>`;

  // Player count
  html += `<div class="player-count">
    <div class="count-header">
      <span class="count-label">Joueurs inscrits</span>
      <span class="count-num">${nbInscrits}<span style="font-size:18px;color:var(--text-muted)">/10</span></span>
    </div>
    <div class="progress-bar"><div class="progress-fill ${isFull?'full':''}" style="width:${pct}%"></div></div>
    ${inscrits.length ? `<div class="inscrit-list">${inscrits.map(n=>`<span class="inscrit-tag">${n}</span>`).join('')}</div>` : ''}
  </div>`;

  // My registration (if match not cancelled and inscriptions open or user already inscrit)
  if (!d.matchAnnule) {
    html += `<div class="my-reg">
      <div class="my-reg-title">Ma participation</div>
      <div class="reg-buttons">
        <button class="btn btn-present ${isInscrit?'active':''}" onclick="register('present')">✅ Je suis là</button>
        <button class="btn btn-absent ${!isInscrit?'active':''}" onclick="register('absent')">❌ Je ne viens pas</button>
      </div>
    </div>`;
  }

  // All players
  html += `<div class="section-title">Tous les joueurs</div>
  <div class="players-grid">`;
  (d.players || []).forEach(p => {
    const isIns = inscrits.includes(p.name);
    html += `<div class="player-chip ${isIns?'inscrit':''}" onclick="switchTab('stats');setTimeout(()=>scrollToPlayer('${p.name}'),100)">
      <div class="chip-avatar">${p.name[0]}</div>
      <div>
        <div class="chip-name">${p.name}</div>
        <div class="chip-pts">🔄 ${p.pts} pts</div>
      </div>
      ${isIns ? '<span style="margin-left:auto;font-size:12px">✅</span>' : ''}
    </div>`;
  });
  html += `</div>`;

  // Admin section
  if (state.user.isAdmin) {
    html += renderAdmin(d, inscrits);
  }

  document.getElementById('homeContent').innerHTML = html;
}

function renderAdmin(d, inscrits) {
  let html = `<div class="admin-section" style="margin-top:16px">
    <div class="admin-title">⚙️ Admin</div>`;

  // Cancel match button
  if (!d.matchAnnule) {
    html += `<button class="btn btn-danger btn-sm" style="margin-bottom:12px;width:100%" onclick="cancelMatch()">❌ Annuler le match</button>`;
  }

  // Save results
  if (inscrits.length > 0) {
    html += `<div style="font-family:'Barlow Condensed';font-size:13px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Résultats du match</div>
    <div class="results-grid" id="adminResultsGrid">`;
    inscrits.forEach(name => {
      if (!state.adminResults[name]) state.adminResults[name] = '';
      html += `<div class="result-row">
        <span class="result-name">${name}</span>
        <div class="result-btns">
          <button class="result-btn V ${state.adminResults[name]==='V'?'active':''}" onclick="setResult('${name}','V')">V</button>
          <button class="result-btn D ${state.adminResults[name]==='D'?'active':''}" onclick="setResult('${name}','D')">D</button>
          <button class="result-btn A ${state.adminResults[name]==='A'?'active':''}" onclick="setResult('${name}','A')">ABS</button>
        </div>
      </div>`;
    });
    html += `</div>
    <button class="btn btn-gold" style="margin-top:12px" onclick="saveResults()">💾 Enregistrer les résultats</button>`;
  }

  html += `</div>`;
  return html;
}

function setResult(name, result) {
  state.adminResults[name] = result;
  // Re-render just the admin grid
  const d = state.data;
  const inscrits = d ? (d.inscrits||[]) : [];
  const grid = document.getElementById('adminResultsGrid');
  if (!grid) return;
  let html = '';
  inscrits.forEach(n => {
    if (!state.adminResults[n]) state.adminResults[n] = '';
    html += `<div class="result-row">
      <span class="result-name">${n}</span>
      <div class="result-btns">
        <button class="result-btn V ${state.adminResults[n]==='V'?'active':''}" onclick="setResult('${n}','V')">V</button>
        <button class="result-btn D ${state.adminResults[n]==='D'?'active':''}" onclick="setResult('${n}','D')">D</button>
        <button class="result-btn A ${state.adminResults[n]==='A'?'active':''}" onclick="setResult('${n}','A')">ABS</button>
      </div>
    </div>`;
  });
  grid.innerHTML = html;
}

async function register(status) {
  try {
    const res = await api({ action:'register', player: state.user.name, status });
    if (res.error) { showToast(res.error, 'error'); return; }
    showToast(status==='present' ? '✅ Inscription confirmée !' : '❌ Désinscription enregistrée');
    await refreshData();
  } catch(e) { showToast('Erreur réseau', 'error'); }
}

async function cancelMatch() {
  if (!confirm('Annuler le match de jeudi ?')) return;
  try {
    const res = await api({ action:'cancelMatch' });
    if (res.success) { showToast('Match annulé'); await refreshData(); }
  } catch(e) { showToast('Erreur', 'error'); }
}

async function saveResults() {
  const filled = Object.entries(state.adminResults).filter(([,v]) => v==='V'||v==='D');
  if (filled.length === 0) { showToast('Aucun résultat saisi', 'error'); return; }
  try {
    const res = await api({ action:'saveResults', results: state.adminResults });
    if (res.success) { showToast('✅ Résultats enregistrés !'); state.adminResults={}; await refreshData(); }
    else showToast(res.error||'Erreur', 'error');
  } catch(e) { showToast('Erreur réseau', 'error'); }
}

// ──────────────────────────────────────────────────────────────
// STATS (FIFA CARDS)
// ──────────────────────────────────────────────────────────────
function renderStats() {
  const d = state.data;
  if (!d || !d.players) return;
  renderStatCards(d.players);
}

function filterStats() {
  const q = document.getElementById('statsSearch').value.toLowerCase();
  const d = state.data;
  if (!d) return;
  const filtered = d.players.filter(p => p.name.toLowerCase().includes(q));
  renderStatCards(filtered);
}

function renderStatCards(players) {
  const d = state.data;
  const grid = document.getElementById('statsGrid');
  if (!players.length) { grid.innerHTML = '<div class="empty-state"><p>Aucun joueur trouvé</p></div>'; return; }

  const inscrits = d ? (d.inscrits||[]) : [];

  grid.innerHTML = players.map(p => {
    const stats = (d.fifaStats && d.fifaStats[p.name]) || {atk:50,def:50,pss:50,sta:50,kep:50,overall:50};
    const overall = stats.overall || Math.round((stats.atk+stats.def+stats.pss+stats.sta+stats.kep)/5);

    const ovClass = overall>=80?'ov-elite':overall>=70?'ov-good':overall>=60?'ov-avg':'ov-low';

    const statDefs = [
      {key:'atk',label:'ATK'},
      {key:'def',label:'DEF'},
      {key:'pss',label:'PSS'},
      {key:'sta',label:'STA'},
      {key:'kep',label:'KEP'},
    ];

    const statsHtml = statDefs.map(({key,label}) => {
      const val = stats[key]||50;
      const cls = val>=80?'stat-elite':val>=70?'stat-good':val>=60?'stat-avg':'stat-low';
      return `<div class="stat-item ${cls}">
        <div class="stat-value">${val}</div>
        <div class="stat-label">${label}</div>
        <div class="stat-bar"><div class="stat-bar-fill" style="width:${val}%"></div></div>
      </div>`;
    }).join('');

    // Last 10 results
    const hist = (p.history||[]).slice(-10);
    const dots = hist.map(h => {
      if (h.result==='V') return `<span class="dot dot-V">V</span>`;
      if (h.result==='D') return `<span class="dot dot-D">D</span>`;
      return `<span class="dot dot-empty"></span>`;
    }).join('');

    const isIns = inscrits.includes(p.name);

    return `<div class="fifa-card" id="card-${p.name.replace(/\s/g,'_')}">
      <div class="fifa-card-header">
        <div class="fifa-overall ${ovClass}">
          <span class="ov-num">${overall}</span>
          <span class="ov-label">OVR</span>
        </div>
        <div class="fifa-player-info">
          <div class="fifa-player-name">${p.name}${isIns?'<span style="color:var(--green-light);font-size:13px;margin-left:6px">✅</span>':''}</div>
          <div class="fifa-player-sub">🔄 ${p.pts} pts · ${hist.length} matchs</div>
        </div>
      </div>
      <div class="fifa-card-stats">${statsHtml}</div>
      ${dots ? `<div style="padding:8px 14px 12px;display:flex;flex-wrap:wrap;gap:4px;border-top:1px solid var(--border)">${dots}</div>` : ''}
    </div>`;
  }).join('');
}

function scrollToPlayer(name) {
  const id = 'card-'+name.replace(/\s/g,'_');
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

// ──────────────────────────────────────────────────────────────
// TEAMS
// ──────────────────────────────────────────────────────────────
function renderTeams() {
  const d = state.data;
  const container = document.getElementById('teamsContent');
  if (!d || !d.teamVoting || !d.teamVoting.team1) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">⚡</div><p>Équipes disponibles quand le groupe est complet (10 joueurs)</p></div>`;
    return;
  }

  const tv = d.teamVoting;
  const hasVoted = tv.voters && tv.voters.includes(state.user.name);
  const totalVotes = (tv.votes1||0) + (tv.votes2||0);
  const pct1 = totalVotes > 0 ? Math.round((tv.votes1/totalVotes)*100) : 50;
  const pct2 = totalVotes > 0 ? Math.round((tv.votes2/totalVotes)*100) : 50;

  let html = '';

  // Pitch
  html += `<div class="pitch-container">
    <div class="pitch" style="min-height:440px;">
      <div class="pitch-center-line"></div>
      <div class="pitch-center-circle"></div>
      <div class="pitch-center-dot"></div>
      <div class="pitch-goal-top"></div>
      <div class="pitch-goal-bot"></div>
      <span class="pitch-team-header t1">ÉQUIPE 1</span>
      <span class="pitch-team-header t2">ÉQUIPE 2</span>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:45px 10px;">
        <div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;">
          ${tv.team1.map(name => renderPitchPlayer(name, 'team1-color')).join('')}
        </div>
        <div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;">
          ${tv.team2.map(name => renderPitchPlayer(name, 'team2-color')).join('')}
        </div>
      </div>
    </div>
  </div>`;

  // Vote section
  html += `<div class="team-vote-section">
    <div class="vote-title">🗳️ Quel est le meilleur équilibre ?</div>`;

  if (!hasVoted) {
    html += `<div class="vote-options">
      <button class="vote-btn team1-vote" onclick="voteTeam(1)">👍 Équipe 1<br><small style="font-weight:400;font-size:11px">est équilibrée</small></button>
      <button class="vote-btn team2-vote" onclick="voteTeam(2)">👍 Équipe 2<br><small style="font-weight:400;font-size:11px">est mieux</small></button>
    </div>`;
  }

  html += `<div class="vote-results" style="margin-top:12px">
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">${totalVotes} vote${totalVotes>1?'s':''} · ${hasVoted?'Tu as voté':'Anonyme'}</div>
    <div class="vote-bar-wrap">
      <div class="vote-bar-label"><span>🔵 Équipe 1</span><span>${tv.votes1} (${pct1}%)</span></div>
      <div class="vote-bar"><div class="vote-bar-fill t1" style="width:${pct1}%"></div></div>
    </div>
    <div class="vote-bar-wrap">
      <div class="vote-bar-label"><span>🔴 Équipe 2</span><span>${tv.votes2} (${pct2}%)</span></div>
      <div class="vote-bar"><div class="vote-bar-fill t2" style="width:${pct2}%"></div></div>
    </div>
  </div>`;

  // Regenerate (admin only)
  if (state.user.isAdmin) {
    html += `<button class="regenerate-btn" onclick="regenerateTeams()">🔄 Régénérer les équipes</button>`;
  }

  html += `</div>`;

  container.innerHTML = html;
}

function renderPitchPlayer(name, teamClass) {
  return `<div class="pitch-player-token ${teamClass}">
    <div class="token-circle">${name[0]}</div>
    <div class="token-name">${name.split(' ')[0]}</div>
  </div>`;
}

async function voteTeam(team) {
  try {
    const res = await api({ action:'voteTeam', player:state.user.name, team:String(team) });
    if (res.error) { showToast(res.error, 'error'); return; }
    showToast('✅ Vote enregistré (anonyme)');
    await refreshData();
    switchTab('teams');
  } catch(e) { showToast('Erreur réseau', 'error'); }
}

async function regenerateTeams() {
  if (!confirm('Régénérer les équipes ?')) return;
  const inscrits = state.data ? (state.data.inscrits||[]) : [];
  try {
    const res = await api({ action:'regenerateTeams', inscrits });
    if (res.team1) { showToast('🔄 Nouvelles équipes générées !'); await refreshData(); }
  } catch(e) { showToast('Erreur', 'error'); }
}

// ──────────────────────────────────────────────────────────────
// MVP VOTE
// ──────────────────────────────────────────────────────────────
function renderMVP() {
  const d = state.data;
  const container = document.getElementById('mvpContent');
  if (!d || !d.mvpVoting || !d.mvpVoting.candidates) {
    container.innerHTML = `<div class="empty-state"><div class="empty-icon">🏆</div><p>Vote MVP disponible après le match du jeudi</p></div>`;
    return;
  }

  const mv = d.mvpVoting;
  const hasVoted = mv.voters && mv.voters.includes(state.user.name);
  const totalVotes = Object.values(mv.votes).reduce((a,b)=>a+b,0);

  // Find winner (most votes)
  let maxVotes = 0, winner = null;
  Object.entries(mv.votes).forEach(([name,v]) => { if(v>maxVotes){maxVotes=v;winner=name;} });

  let html = '';

  // Info card
  html += `<div class="mvp-info">
    <div class="mvp-info-title">🏆 MVP du match</div>
    <div class="mvp-info-body">Vote pour le meilleur joueur du match du ${mv.date||'jeudi'}. Les votes sont anonymes.</div>
  </div>`;

  if (hasVoted && winner && maxVotes > 0) {
    html += `<div class="mvp-winner">
      <div class="winner-icon">🏆</div>
      <div class="winner-name">${winner}</div>
      <div class="winner-votes">${maxVotes} vote${maxVotes>1?'s':''} · ${totalVotes} participant${totalVotes>1?'s':''}</div>
    </div>`;
  }

  // Candidates grid
  html += `<div class="mvp-grid">`;
  mv.candidates.forEach(name => {
    const votes = mv.votes[name] || 0;
    const isWinner = name === winner && maxVotes > 0;
    html += `<div class="mvp-candidate ${hasVoted?'voted':''}" onclick="${hasVoted?'':'voteMVP(\''+name+'\')'}">
      <div class="cand-avatar" style="${isWinner?'background:var(--gold-dark);':''}">${name[0]}</div>
      <div class="cand-name">${name}</div>
      ${hasVoted ? `<div class="cand-votes">${votes}</div><div class="cand-votes-label">vote${votes>1?'s':''}</div>` : '<div style="font-size:11px;color:var(--text-muted)">Voter</div>'}
    </div>`;
  });
  html += `</div>`;

  if (!hasVoted) {
    html += `<p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px">Votes anonymes · ${totalVotes} vote${totalVotes>1?'s':''} déjà</p>`;
  }

  container.innerHTML = html;
}

async function voteMVP(candidate) {
  try {
    const res = await api({ action:'voteMVP', player:state.user.name, candidate });
    if (res.error) { showToast(res.error, 'error'); return; }
    showToast('🏆 Vote MVP enregistré !');
    // Remove badge
    const mvpTab = document.getElementById('tabMVP');
    const badge = mvpTab.querySelector('.badge');
    if (badge) badge.remove();
    await refreshData();
  } catch(e) { showToast('Erreur réseau', 'error'); }
}

// ──────────────────────────────────────────────────────────────
// PIN
// ──────────────────────────────────────────────────────────────
function openPinModal() { document.getElementById('pinModal').classList.add('open'); }
function closePinModal() { document.getElementById('pinModal').classList.remove('open'); }

async function doChangePin() {
  const oldPin = document.getElementById('oldPin').value.trim();
  const newPin = document.getElementById('newPin').value.trim();
  const newPin2 = document.getElementById('newPin2').value.trim();
  const errEl = document.getElementById('pinError');
  errEl.classList.remove('show');

  if (!oldPin||!newPin||!newPin2) { errEl.textContent='Remplis tous les champs'; errEl.classList.add('show'); return; }
  if (newPin !== newPin2) { errEl.textContent='Les nouveaux PIN ne correspondent pas'; errEl.classList.add('show'); return; }

  try {
    const res = await api({ action:'changePin', tel:state.user.tel, oldPin, newPin });
    if (res.success) { showToast('✅ PIN modifié !'); closePinModal(); }
    else { errEl.textContent = res.error||'Erreur'; errEl.classList.add('show'); }
  } catch(e) { errEl.textContent='Erreur réseau'; errEl.classList.add('show'); }
}

// ──────────────────────────────────────────────────────────────
// UTILS
// ──────────────────────────────────────────────────────────────
function showToast(msg, type='success') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show ' + type;
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

function getNextThursday() {
  const now = new Date(), day = now.getDay();
  let diff = (4 - day + 7) % 7; if(diff===0) diff=7;
  const next = new Date(now); next.setDate(now.getDate()+diff); return next;
}

function getPhaseClient() {
  const now = new Date();
  const paris = new Date(now.toLocaleString("en-US",{timeZone:"Europe/Paris"}));
  const day = paris.getDay(), h = paris.getHours()+paris.getMinutes()/60;
  if (day===4) return h<12?'open_classic':'closed';
  if (day===5) { if(h<8) return 'closed'; if(h<12) return 'open_rotation'; return 'open_classic'; }
  return 'open_classic';
}
